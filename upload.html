<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Upload Materials</title>
</head>
<body>

    <!-- StudyMate Project | Upload Page | Assigned to: Brett -->

    <h1>StudyMate</h1>
    <h2>Upload Study Materials</h2>

    <p>Select a learning material from your computer.</p>

    <form onsubmit="event.preventDefault();
        alert('Demo only: File upload is not connected to a backend.');">

        <p>
            <label for="subject">Subject:</label><br>
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option>Introduction to Computing</option>
                <option>Computer Programming 1</option>
                <option>Web Design</option>
                <option>Mathematics</option>
            </select>
        </p>

        <p>
            <label for="material">Choose File:</label><br>
            <input type="file" id="material" name="material"
                accept=".pdf,.doc,.docx,.txt" required>
        </p>

        <button type="submit">Upload Material</button>
    </form>

    <h3>Available Features</h3>
    <ul>
        <li>Choose a study subject.</li>
        <li>Select a learning material.</li>
        <li>Prepare materials for review.</li>
    </ul>

    <p><a href="dashboard.html">Back to Dashboard</a></p>
    <p><a href="../index.html">Back to Home</a></p>

</body>
</html>
