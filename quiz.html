<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Quiz</title>
</head>
<body>

    <!-- StudyMate Project | Quiz Page | Assigned to: Jhunric -->

    <h1>StudyMate</h1>
    <h2>Knowledge Quiz</h2>

    <form id="quizForm">

        <p><strong>1. What does HTML stand for?</strong></p>
        <label><input type="radio" name="q1" value="a" required> High Text Machine Language</label><br>
        <label><input type="radio" name="q1" value="b"> HyperText Markup Language</label><br>
        <label><input type="radio" name="q1" value="c"> Home Tool Markup Language</label>

        <p><strong>2. Which tag creates a paragraph?</strong></p>
        <label><input type="radio" name="q2" value="a" required> &lt;h1&gt;</label><br>
        <label><input type="radio" name="q2" value="b"> &lt;img&gt;</label><br>
        <label><input type="radio" name="q2" value="c"> &lt;p&gt;</label>

        <p><strong>3. Which tag creates a hyperlink?</strong></p>
        <label><input type="radio" name="q3" value="a" required> &lt;a&gt;</label><br>
        <label><input type="radio" name="q3" value="b"> &lt;table&gt;</label><br>
        <label><input type="radio" name="q3" value="c"> &lt;body&gt;</label>

        <p><strong>4. Which tag creates a table row?</strong></p>
        <label><input type="radio" name="q4" value="a" required> &lt;td&gt;</label><br>
        <label><input type="radio" name="q4" value="b"> &lt;tr&gt;</label><br>
        <label><input type="radio" name="q4" value="c"> &lt;th&gt;</label>

        <p><strong>5. Which tag displays the largest heading?</strong></p>
        <label><input type="radio" name="q5" value="a" required> &lt;h6&gt;</label><br>
        <label><input type="radio" name="q5" value="b"> &lt;head&gt;</label><br>
        <label><input type="radio" name="q5" value="c"> &lt;h1&gt;</label>

        <br>
        <button type="submit">Submit Quiz</button>
    </form>

    <p id="score"></p>

    <button type="button"
        onclick="window.location.href='results.html'">
        View Results Page
    </button>

    <p><a href="dashboard.html">Back to Dashboard</a></p>
    <p><a href="../index.html">Back to Home</a></p>

    <script>
        document.getElementById("quizForm").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const answers = {
                    q1: "b",
                    q2: "c",
                    q3: "a",
                    q4: "b",
                    q5: "c"
                };

                let score = 0;

                for (let question in answers) {
                    const selected = document.querySelector(
                        'input[name="' + question + '"]:checked'
                    );

                    if (selected && selected.value === answers[question]) {
                        score++;
                    }
                }

                document.getElementById("score").textContent =
                    "Your score: " + score + " out of 5.";

                sessionStorage.setItem("studyMateScore", score);
            }
        );
    </script>

</body>
</html>
